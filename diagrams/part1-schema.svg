<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Part 1 initial MongoDB document schema">
  <defs>
    <style>
      .title { font: 700 15px 'Liberation Sans', Arial, sans-serif; fill: #14324F; }
      .coll { font: 700 12.5px 'Liberation Sans', Arial, sans-serif; fill: #FFFFFF; }
      .field { font: 400 11px 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #1A2430; }
      .muted { font: 400 10px 'Liberation Sans', Arial, sans-serif; fill: #5B6773; }
      .idx { font: 600 9.5px 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #0F4F4F; }
      .lbl { font: 600 9.5px 'Liberation Sans', Arial, sans-serif; fill: #1B4F72; }
      .emb { font: 700 10px 'Liberation Sans', Arial, sans-serif; fill: #14324F; }
      .cap { font: 400 10px 'Liberation Sans', Arial, sans-serif; fill: #3D4A57; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1B4F72"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#F6F8FB"/>
  <text x="24" y="26" class="title">Part 1 — Initial document schema (MongoDB)</text>
  <text x="24" y="44" class="cap">References for live links; embedded snapshots so receipts stay historically accurate. Status updates are single-document and atomic.</text>

  <!-- USERS -->
  <g>
    <rect x="24" y="62" width="220" height="28" rx="4" fill="#14324F"/>
    <text x="134" y="81" class="coll" text-anchor="middle">users</text>
    <rect x="24" y="90" width="220" height="168" rx="0" fill="#FFFFFF" stroke="#C9D3DE"/>
    <text x="36" y="112" class="field">_id: ObjectId</text>
    <text x="36" y="130" class="field">email: string  (unique)</text>
    <text x="36" y="148" class="field">passwordHash: string</text>
    <text x="36" y="166" class="field">profile { firstName, lastName,</text>
    <text x="50" y="182" class="field">phone }</text>
    <text x="36" y="200" class="field">addresses[ ] { label, street,</text>
    <text x="50" y="216" class="field">city, country, isDefault }</text>
    <text x="36" y="236" class="field">createdAt: date</text>
    <rect x="24" y="258" width="220" height="46" fill="#E8F3F3" stroke="#C9D3DE"/>
    <text x="36" y="276" class="idx">idx: { email: 1 } unique</text>
    <text x="36" y="292" class="idx">idx: { "addresses.city": 1 }</text>
  </g>

  <!-- PRODUCTS -->
  <g>
    <rect x="270" y="62" width="220" height="28" rx="4" fill="#0F5C5C"/>
    <text x="380" y="81" class="coll" text-anchor="middle">products</text>
    <rect x="270" y="90" width="220" height="168" fill="#FFFFFF" stroke="#C9D3DE"/>
    <text x="282" y="112" class="field">_id: ObjectId</text>
    <text x="282" y="130" class="field">sku: string  (unique)</text>
    <text x="282" y="148" class="field">name, description, tags[ ]</text>
    <text x="282" y="166" class="field">category: string</text>
    <text x="282" y="184" class="field">price, currency, stock</text>
    <text x="282" y="202" class="field">rating, images[ ]</text>
    <text x="282" y="220" class="field">createdAt: date</text>
    <text x="282" y="242" class="muted">Catalog: fast lookup + text search</text>
    <rect x="270" y="258" width="220" height="46" fill="#E8F3F3" stroke="#C9D3DE"/>
    <text x="282" y="276" class="idx">idx: text(name, description, tags)</text>
    <text x="282" y="292" class="idx">idx: { category: 1, price: 1 }</text>
  </g>

  <!-- ORDERS -->
  <g>
    <rect x="516" y="62" width="220" height="28" rx="4" fill="#8A3B12"/>
    <text x="626" y="81" class="coll" text-anchor="middle">orders</text>
    <rect x="516" y="90" width="220" height="246" fill="#FFFFFF" stroke="#C9D3DE"/>
    <text x="528" y="110" class="field">_id: ObjectId</text>
    <text x="528" y="126" class="field">userId: ObjectId   → users</text>
    <!-- customer embed -->
    <rect x="526" y="134" width="200" height="52" rx="3" fill="#FFF4EC" stroke="#E2C4B0"/>
    <text x="536" y="148" class="emb">customer  (snapshot)</text>
    <text x="536" y="164" class="field">userId, email, name,</text>
    <text x="536" y="178" class="field">shippingAddress { … }</text>
    <!-- items embed -->
    <rect x="526" y="190" width="200" height="52" rx="3" fill="#FFF4EC" stroke="#E2C4B0"/>
    <text x="536" y="204" class="emb">items[ ]  (snapshot)</text>
    <text x="536" y="220" class="field">productId, sku, name,</text>
    <text x="536" y="234" class="field">unitPrice, qty, subtotal</text>
    <text x="528" y="258" class="field">totals { subtotal, shipping,</text>
    <text x="542" y="272" class="field">total, currency }</text>
    <text x="528" y="290" class="field">status, statusHistory[ ]</text>
    <text x="528" y="306" class="field">  { status, at }, createdAt</text>
    <rect x="516" y="336" width="220" height="62" fill="#E8F3F3" stroke="#C9D3DE"/>
    <text x="528" y="354" class="idx">idx: { userId: 1, createdAt: -1 }</text>
    <text x="528" y="370" class="idx">idx: { status: 1, createdAt: -1 }</text>
    <text x="528" y="386" class="idx">writeConcern: majority</text>
  </g>

  <!-- Arrows: users <-> orders, products <-> orders -->
  <!-- userId reference: from orders left to users right, bottom path -->
  <path d="M 516 118 C 430 118, 430 430, 244 430 L 134 430 L 134 304" fill="none" stroke="#1B4F72" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="280" y="422" class="lbl">userId  ·  1 user → N orders  (reference)</text>

  <path d="M 516 220 C 470 220, 470 450, 380 450 L 380 304" fill="none" stroke="#1B4F72" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="280" y="468" class="lbl">items.productId  ·  reference + price/name snapshot</text>

  <text x="24" y="508" class="cap">High write throughput: one atomic update per status change. Catalog reads use the text index and the category+price compound index.</text>
</svg>
